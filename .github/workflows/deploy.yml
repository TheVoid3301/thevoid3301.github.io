      - name: Check CUDA image paths
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo "CUDA files:"
          ls -la src/content/docs/algorithms/CUDA/
          ls -la src/content/docs/algorithms/CUDA/images/

          echo "Check SVG:"
          test -f src/content/docs/algorithms/CUDA/images/2d-convolution-2.svg
          echo "SVG exists on Linux!"

          echo "Node version:"
          node --version