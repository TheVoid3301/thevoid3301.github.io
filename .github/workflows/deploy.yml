name: Deploy Astro Starlight

# 每次 push 到 main 分支自动运行
on:
  push:
    branches:
      - main

  # 支持在 GitHub 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build and Upload Astro
        uses: withastro/action@v6
        with:
          node-version: 24
          # Avoid stale content paths after case-only directory renames.
          cache: false

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v5
