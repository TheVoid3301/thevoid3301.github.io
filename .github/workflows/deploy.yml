
name: Deploy Astro Starlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check CUDA image paths
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "CUDA files:"
          ls -la src/content/docs/algorithms/CUDA/
          ls -la src/content/docs/algorithms/CUDA/images/

          echo "Check SVG:"
          test -f src/content/docs/algorithms/CUDA/images/2d-convolution-2.svg
          echo "SVG exists on Linux!"

          echo "Node version:"
          node --version

      - name: Build and Upload Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v5
